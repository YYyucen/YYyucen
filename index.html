<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人網站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        img {
            width: 100%;
            max-width: 300px;
            border-radius: 50%;
        }
        h1 {
            color: #333;
        }
        a {
            text-decoration: none;
            color: #007BFF;
        }
        .pdf-link {
            display: block;
            margin: 10px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>歡迎來到我的個人網站</h1>
        <img src="myphoto.jpg" alt="我的照片">
        <h2>我的作品</h2>
        <p>以下是我的三樣作品，點擊連結查看 PDF 檔案：</p>
        <a class="pdf-link" href="作品1.pdf" target="_blank">作品 1</a>
        <a class="pdf-link" href="作品2.pdf" target="_blank">作品 2</a>
        <a class="pdf-link" href="作品3.pdf" target="_blank">作品 3</a>
    </div>
</body>
</html>
